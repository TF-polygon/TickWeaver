# tickweaver futures backtest config.
#
# Identical layout to default.yaml; the only meaningful difference is
# run.mode: 'futures'. With this config strategies may freely open short
# positions via api.market_sell / limit_sell / stop_sell from a FLAT state
# (in spot mode those would raise SpotShortNotAllowedError).
#
# Usage:
#   python scripts/run_backtest.py --strategy <name> --config futures.yaml
#
# Cost fields (commission/slippage/spread) use PERCENT units:
#   0.05 means 0.05%, NOT 5%.

run:
  initial_capital: 10000.0          # starting cash in quote currency (USDT)
  mode: futures                     # short selling allowed
  leverage: 100.0                   # Exposed via api.leverage. Strategies
                                    # typically use it as a qty multiplier:
                                    #   qty = notional_usdt * api.leverage / price
                                    # Broker accounting still debits cash at
                                    # notional; true margin trading is planned.

data:
  exchange: binance                 # ccxt exchange id
  symbol: "BTC/USDT:USDT"           # ccxt symbol notation (USDT-M perpetual)
  timeframe: "1h"                   # 1m / 5m / 15m / 1h / 4h / 1d ...
  start_date: "2024-01-01"          # inclusive (YYYY-MM-DD)
  end_date:   "2024-07-01"          # exclusive (YYYY-MM-DD)

execution:
  commission: 0.05                  # 0.05 == 0.05% per side
  slippage:   0.02                  # 0.02 == 0.02%
  spread:     0.0                   # 0    == 0.00%  (set >0 for synthetic spread)

tick_synthesis:
  generator: uniform                # uniform (default) | bridge
  n_ticks_min: 8                    # synthesized ticks per bar (random in [min, max])
  n_ticks_max: 256
  seed: 42                          # deterministic seed (C7 contract)

reporting:
  out_dir: null                     # null -> reports/<strategy>_<UTC ts>/
  dump_ticks: 0                     # >0 = dump N sample bars worth of ticks

logging:
  level: INFO                       # DEBUG | INFO | WARNING | ERROR
