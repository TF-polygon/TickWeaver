# tickweaver — 기본 백테스트 설정 (D17 — run_backtest 의 기본 config)
#
# 이 파일은 `python scripts/run_backtest.py --strategy <path>` 가
# `--config` 를 명시하지 않았을 때 자동으로 사용됩니다.

run:
  initial_cash: 10000.0       # 시작 현금 (USDT)
  market_type: usdt_m_perpetual

period:
  # auto-period: 데이터 파일의 실제 범위를 자동 사용 (D17)
  auto: true
  # auto=false 일 때만 사용:
  start: null
  end: null

tick_synthesis:
  # uniform | bridge — 일반 백테스트는 한 가지만. 비교는 compare_runs.py 전용 (D16)
  generator: uniform
  n_min: 8
  n_max: 256
  seed: 42

execution:
  fee_bps: 5.0                # 0.05%
  slippage_bps: 2.0           # 0.02%

reporting:
  out_dir: null               # null 이면 reports/<strategy>_<UTC ts>/ 자동 생성
  dump_ticks: 0               # >0 이면 N 개 봉의 합성 tick 을 parquet+PNG 로 dump

logging:
  level: INFO
